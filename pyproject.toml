[project]
name = "carl"
version = "0.1.0"
description = "Personal voice assistant with real memory and behavioral learning"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "click>=8.1",
    "ulid-py>=1.1",
    "aiosqlite>=0.20",
    "watchfiles>=0.21",

    # LLM clients
    "anthropic>=0.40",
    "openai>=1.40",

    # TTS
    "elevenlabs>=2.0",

    # STT / search
    "deepgram-sdk>=7.6,<8",   # v2 API surface — client.listen.v2.connect(); older paths dead
    "tavily-python>=0.5",

    # Audio + VAD + wake word (mocked at Milestone 1 but installed so real stages can drop in)
    "sounddevice>=0.4",
    "numpy>=1.26",
    "silero-vad>=5.1",
    "openwakeword>=0.6",       # Apache-2.0 code + CC-BY-NC-SA models — swapped in for Porcupine (which now gates signup behind corporate email)
    "janus>=1.0",             # thread-safe queue for audio-callback → asyncio bridge
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
carl = "carl.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carl*"]

[tool.setuptools.package-data]
"carl.storage.migrations" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = [
    "E501",   # long lines OK when they're readable
    "A002",   # `type` as parameter name matches our SQL column names intentionally
    "B017",   # blind Exception is fine in tests that assert Pydantic validation errors
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
